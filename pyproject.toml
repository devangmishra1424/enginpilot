[project]
name = "enginpilot-assignment"
version = "0.1.0"
description = "EnginPilot RAG retriever, agents and evaluation for data-centre asset maintenance"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docling>=2.110.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.0",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langgraph>=1.2.8",
    "pytest>=9.1.1",
    "deepeval>=4.0.7",
]

[project.optional-dependencies]
graph = ["neo4j>=5.0.0"]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["."]

